name: CI/CD Homelab

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  validate:
    name: Validate application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: PHP syntax check
        shell: bash
        run: |
          set -euo pipefail

          php_files=()

          for dir in public src; do
            if [[ -d "$dir" ]]; then
              while IFS= read -r -d '' file; do
                php_files+=("$file")
              done < <(find "$dir" -type f -name '*.php' -print0)
            fi
          done

          if (( ${#php_files[@]} == 0 )); then
            echo "::notice::No se encontraron archivos PHP; se omite la comprobación de sintaxis."
          else
            for file in "${php_files[@]}"; do
              php -l "$file"
            done
          fi

      - name: Docker build validation
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: local/homelab-app:test

  publish:
    name: Publish image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate

    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    outputs:
      image: ${{ steps.image.outputs.image }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image reference
        id: image
        shell: bash
        run: |
          set -euo pipefail

          REPOSITORY_LOWER="$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          IMAGE="ghcr.io/${REPOSITORY_LOWER}:sha-${GITHUB_SHA}"

          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "IMAGE=${IMAGE}" >> "$GITHUB_ENV"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}

  deploy:
    name: Deploy production
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: publish

    runs-on: ubuntu-latest

    environment:
      name: production
      url: https://app_1.alexchata.com/

    concurrency:
      group: production
      cancel-in-progress: false

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:ci

      - name: Configure SSH
        shell: bash
        run: |
          mkdir -p ~/.ssh

          printf '%s\n' '${{ secrets.DEPLOY_SSH_KEY }}' \
            > ~/.ssh/id_ed25519

          printf '%s\n' '${{ secrets.DEPLOY_KNOWN_HOSTS }}' \
            > ~/.ssh/known_hosts

          chmod 600 ~/.ssh/id_ed25519
          chmod 644 ~/.ssh/known_hosts

      - name: Deploy immutable image
        shell: bash
        env:
          IMAGE: ${{ needs.publish.outputs.image }}
        run: |
          set -euo pipefail

          ssh \
            -i ~/.ssh/id_ed25519 \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            homelab-deploy@100.95.174.0 \
            "deploy ${IMAGE}"
